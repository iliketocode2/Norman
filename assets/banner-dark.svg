  <text x="76" y="238" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="-0.5" fill="#e6e7ec">A small language for AI agents</text>
  <text x="76" y="282" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a9adbd">Typed model calls, budgets in money and time,</text>
  <text x="76" y="310" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a9adbd">tools as capabilities, and concurrency.</text>

