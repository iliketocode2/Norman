  <text x="732" y="220" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" xml:space="preserve"><tspan fill="#e6e7ec">  </tspan><tspan fill="#767b8d">[</tspan><tspan fill="#f0a28c">Sell</tspan><tspan fill="#e6e7ec"> </tspan><tspan fill="#767b8d">(</tspan><tspan fill="#e6e7ec">reason</tspan><tspan fill="#e6e7ec"> </tspan><tspan fill="#767b8d">(</tspan><tspan fill="#f0a28c">Text</tspan><tspan fill="#e6e7ec"> </tspan><tspan fill="#e0a870">400</tspan><tspan fill="#767b8d">)</tspan><tspan fill="#767b8d">)</tspan><tspan fill="#767b8d">]</tspan><tspan fill="#767b8d">)</tspan></text>
  <text x="732" y="248" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" xml:space="preserve"></text>
  <text x="732" y="276" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" xml:space="preserve"><tspan fill="#767b8d">(</tspan><tspan fill="#d79bf0">under</tspan><tspan fill="#e6e7ec"> </tspan><tspan fill="#767b8d">(</tspan><tspan fill="#767b8d">[</tspan><tspan fill="#e6e7ec">cost</tspan><tspan fill="#e6e7ec"> </tspan><tspan fill="#e0a870">$0.05</tspan><tspan fill="#767b8d">]</tspan><tspan fill="#e6e7ec"> </tspan><tspan fill="#767b8d">[</tspan><tspan fill="#e6e7ec">time</tspan><tspan fill="#e6e7ec"> </tspan><tspan fill="#e0a870">30s</tspan><tspan fill="#767b8d">]</tspan><tspan fill="#767b8d">)</tspan></text>
