# Keep the documentation site honest: rebuild its interpreter and run every
# example on every push. The site itself is served by GitHub Pages straight
# from docs/ on the default branch, so this workflow publishes nothing -- it
# only fails when an example or the committed .wasm has drifted.
name: docs

on:
  push:
    paths: ['src/**', 'docs/**', 'Cargo.toml', 'scripts/build-docs.sh', '.github/workflows/docs.yml']
  pull_request:
    paths: ['src/**', 'docs/**', 'Cargo.toml']

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the wasm interpreter and run every example
        run: ./scripts/build-docs.sh
      - name: The committed interpreter must match the source
        run: |
          if ! git diff --quiet -- docs/munorman.wasm; then
            echo "::error::docs/munorman.wasm is stale. Run ./scripts/build-docs.sh and commit the result."
            exit 1
          fi
