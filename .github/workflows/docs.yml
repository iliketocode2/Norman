# Keep the documentation site honest.
#
# The site is served by GitHub Pages straight from docs/ on the default
# branch, so this workflow publishes nothing. It checks three things:
#
#   1. the interpreter that is actually published runs every example on the
#      site,
#   2. an interpreter freshly built from src/ runs them too, and
#   3. the pages and READMEs repeat no claim known to be stale (the STALE
#      list in docs/verify.mjs).
#
# The first catches a stale or broken commit; the second catches a source
# change that breaks an example.
name: docs

on:
  # The two lists must stay the same. `cargo test` reads tests/, examples/
  # and eval/ (every example file and every eval task is run), so a change
  # to any one of them alone must run the check job.
  push:
    paths: ['src/**', 'tests/**', 'examples/**', 'eval/**', 'docs/**', 'scripts/**', 'Cargo.toml', 'Cargo.lock', 'rustfmt.toml', 'README.md', 'design/README.md', '.github/workflows/docs.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'examples/**', 'eval/**', 'docs/**', 'scripts/**', 'Cargo.toml', 'Cargo.lock', 'rustfmt.toml', 'README.md', 'design/README.md', '.github/workflows/docs.yml']

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The published interpreter runs every example
        run: node docs/verify.mjs

      - name: Rebuild from source, then run them again
        run: bash scripts/build-docs.sh

      - name: Note whether the committed interpreter is stale
        # Deliberately a notice, not a failure: Rust does not produce
        # byte-identical output across toolchain versions, so a difference
        # here is weak evidence. The two steps above are the real checks.
        run: |
          if ! git diff --quiet -- docs/munorman.wasm; then
            echo "::notice::docs/munorman.wasm differs from a fresh build. If you changed src/, run scripts/build-docs.sh and commit the result."
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        # The live tests are #[ignore]d: they need an API key and spend money.
        run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The eval harness's own tests
        # A mock client stands in for the model, so no API key is needed and
        # nothing is spent.
        run: |
          cargo build
          npm ci --prefix eval
          node eval/test.mjs --norman target/debug/norman
